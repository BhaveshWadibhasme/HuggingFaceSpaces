name: CI

# Source checks for pull requests and main. No secrets and no deploy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Compile and test
        run: |
          python -m compileall -q app.py
          python -m pytest -q

  import-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Install runtime dependencies and execute the app script
        run: |
          python -m pip install -r requirements.txt
          python -c "import numpy, streamlit; from altair.vegalite.v4.api import Chart"
          python app.py
